<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">XGBoost churn model assessment</title>
  <desc id="desc">Editorial model card showing accuracy, sensitivity, specificity, F1 score, AUC, a receiver operating characteristic curve, and the strongest recorded feature groups.</desc>
  <defs>
    <linearGradient id="rocFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="800" fill="#f8fafc"/>
  <path d="M0 0h1400v10H0z" fill="#2563eb"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="74" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" letter-spacing="2">MODEL ASSESSMENT / XGBOOST</text>
    <text x="70" y="125" fill="#0f172a" font-size="38" font-weight="700" letter-spacing="-1.2">Customer churn classification</text>
    <text x="70" y="159" fill="#64748b" font-size="17">Test-set discrimination, classification balance, and recorded feature structure</text>

    <g transform="translate(1092 58)">
      <rect width="238" height="106" rx="10" fill="#0f172a"/>
      <circle cx="25" cy="27" r="6" fill="#14b8a6"/>
      <text x="43" y="32" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.2">SELECTED MODEL</text>
      <text x="24" y="72" fill="#ffffff" font-size="25" font-weight="700">XGBoost</text>
      <text x="24" y="94" fill="#94a3b8" font-size="12">20% held-out test set</text>
    </g>

    <g filter="url(#shadow)">
      <g transform="translate(70 208)">
        <rect width="232" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="34" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">ACCURACY</text>
        <text x="22" y="90" fill="#0f172a" font-size="43" font-weight="700">85.8%</text>
        <rect x="22" y="109" width="188" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="22" y="109" width="161" height="5" rx="2.5" fill="#2563eb"/>
      </g>
      <g transform="translate(320 208)">
        <rect width="232" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="34" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">SENSITIVITY</text>
        <text x="22" y="90" fill="#0f172a" font-size="43" font-weight="700">82.8%</text>
        <rect x="22" y="109" width="188" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="22" y="109" width="156" height="5" rx="2.5" fill="#14b8a6"/>
      </g>
      <g transform="translate(570 208)">
        <rect width="232" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="34" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">SPECIFICITY</text>
        <text x="22" y="90" fill="#0f172a" font-size="43" font-weight="700">86.8%</text>
        <rect x="22" y="109" width="188" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="22" y="109" width="163" height="5" rx="2.5" fill="#2563eb"/>
      </g>
      <g transform="translate(820 208)">
        <rect width="232" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="22" y="34" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">F1 SCORE</text>
        <text x="22" y="90" fill="#0f172a" font-size="43" font-weight="700">0.743</text>
        <rect x="22" y="109" width="188" height="5" rx="2.5" fill="#e2e8f0"/>
        <rect x="22" y="109" width="140" height="5" rx="2.5" fill="#14b8a6"/>
      </g>
      <g transform="translate(1070 208)">
        <rect width="260" height="132" rx="10" fill="#2563eb"/>
        <text x="22" y="34" fill="#bfdbfe" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1">ROC AUC</text>
        <text x="22" y="90" fill="#ffffff" font-size="43" font-weight="700">0.926</text>
        <text x="22" y="113" fill="#dbeafe" font-size="12">Strong ranking performance</text>
      </g>
    </g>

    <g transform="translate(70 382)">
      <rect width="750" height="345" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="28" y="42" fill="#0f172a" font-size="20" font-weight="700">Receiver operating characteristic</text>
      <text x="28" y="67" fill="#64748b" font-size="13">True-positive rate across false-positive thresholds</text>

      <g transform="translate(72 97)">
        <g stroke="#e2e8f0" stroke-width="1">
          <line x1="0" y1="0" x2="0" y2="190"/>
          <line x1="0" y1="190" x2="620" y2="190"/>
          <line x1="0" y1="142.5" x2="620" y2="142.5"/>
          <line x1="0" y1="95" x2="620" y2="95"/>
          <line x1="0" y1="47.5" x2="620" y2="47.5"/>
          <line x1="155" y1="0" x2="155" y2="190"/>
          <line x1="310" y1="0" x2="310" y2="190"/>
          <line x1="465" y1="0" x2="465" y2="190"/>
          <line x1="620" y1="0" x2="620" y2="190"/>
        </g>
        <path d="M0 190 C7 115 18 75 43 50 C82 20 142 12 218 8 C338 3 475 1 620 0 L620 190 Z" fill="url(#rocFill)"/>
        <path d="M0 190 C7 115 18 75 43 50 C82 20 142 12 218 8 C338 3 475 1 620 0" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
        <path d="M0 190L620 0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
        <circle cx="43" cy="50" r="6" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/>
        <g fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">
          <text x="-8" y="211">0.0</text><text x="145" y="211">0.25</text><text x="301" y="211">0.50</text><text x="456" y="211">0.75</text><text x="610" y="211">1.0</text>
          <text x="-31" y="194">0.0</text><text x="-31" y="147">0.25</text><text x="-31" y="99">0.50</text><text x="-31" y="52">0.75</text><text x="-31" y="5">1.0</text>
        </g>
        <text x="257" y="240" fill="#64748b" font-size="12">False-positive rate</text>
        <text transform="translate(-54 128) rotate(-90)" fill="#64748b" font-size="12">True-positive rate</text>
      </g>
    </g>

    <g transform="translate(842 382)">
      <rect width="488" height="345" rx="12" fill="#0f172a"/>
      <text x="28" y="42" fill="#ffffff" font-size="20" font-weight="700">Strongest recorded drivers</text>
      <text x="28" y="67" fill="#94a3b8" font-size="13">Relative XGBoost feature importance</text>

      <g transform="translate(28 104)" font-size="12">
        <text x="0" y="13" fill="#cbd5e1">Total amount · Mar 2021</text>
        <rect x="210" y="0" width="216" height="16" rx="3" fill="#1e293b"/><rect x="210" y="0" width="216" height="16" rx="3" fill="#2563eb"/>
        <text x="0" y="57" fill="#cbd5e1">Total activity · Mar 2021</text>
        <rect x="210" y="44" width="216" height="16" rx="3" fill="#1e293b"/><rect x="210" y="44" width="105" height="16" rx="3" fill="#3b82f6"/>
        <text x="0" y="101" fill="#cbd5e1">Most-active count</text>
        <rect x="210" y="88" width="216" height="16" rx="3" fill="#1e293b"/><rect x="210" y="88" width="39" height="16" rx="3" fill="#14b8a6"/>
        <text x="0" y="145" fill="#cbd5e1">Province indicator</text>
        <rect x="210" y="132" width="216" height="16" rx="3" fill="#1e293b"/><rect x="210" y="132" width="38" height="16" rx="3" fill="#14b8a6"/>
        <text x="0" y="189" fill="#cbd5e1">Three-month amount</text>
        <rect x="210" y="176" width="216" height="16" rx="3" fill="#1e293b"/><rect x="210" y="176" width="22" height="16" rx="3" fill="#14b8a6"/>
      </g>

      <line x1="28" y1="316" x2="460" y2="316" stroke="#334155"/>
      <circle cx="36" cy="329" r="4" fill="#f59e0b"/>
      <text x="49" y="334" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">INTERPRETATION REQUIRES SHAP / ERROR ANALYSIS</text>
    </g>

    <text x="70" y="770" fill="#64748b" font-size="13">Recorded test metrics from the executed FDC105 notebook. Feature importance indicates model use, not causal effect.</text>
  </g>
</svg>
